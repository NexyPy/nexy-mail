[project]
name = "nexy-mail"
version = "0.1.0"
description = "Email for Nexy apps"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Espoir LOEMBA" }]
requires-python = ">=3.12"
keywords = ["nexy", "email", "smtp", "templates", "outbox"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/NexyPy/nexy-mail"
Repository = "https://github.com/NexyPy/nexy-mail"
Issues = "https://github.com/NexyPy/nexy-mail/issues"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server/nexy_mail"]

[tool.mypy]
strict = true
files = "src/server/nexy_mail"
show_error_codes = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG",
    "C4", "DTZ", "ERA", "PLE", "LOG", "ICN", "ASYNC", "RSE",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["nexy_mail"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -ra"
